name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Biome
        run: pnpm exec biome ci .

  typecheck:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

  unit:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Clickt reskin
        run: pnpm verify:reskin

      - name: Run unit tests
        run: pnpm test

  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build monorepo
        run: pnpm build

  integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: kaneo_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kaneo_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      AUTH_SECRET: test-secret-with-at-least-32-chars
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/kaneo_test
      KANEO_API_URL: http://localhost:1337
      KANEO_CLIENT_URL: http://localhost:5173
      DISABLE_GUEST_ACCESS: "false"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run API integration tests
        run: pnpm test:integration

  docker-build:
    runs-on: ubuntu-24.04
    env:
      SMOKE_IMAGE: clickt-hivemind-ci:${{ github.sha }}
      IMAGE_VERSION: ci-${{ github.sha }}
      UPSTREAM_VERSION: "2.18.0"
      RESKIN_REVISION: 4a5f68c4543dd58dc32bddb03259e4a7263239de
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build kaneo image (smoke test)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.kaneo
          platforms: linux/amd64
          load: true
          push: false
          tags: ${{ env.SMOKE_IMAGE }}
          build-args: |
            OCI_SOURCE=https://github.com/${{ github.repository }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ env.IMAGE_VERSION }}
            KANEO_UPSTREAM_VERSION=${{ env.UPSTREAM_VERSION }}
            CLICKT_RESKIN_REVISION=${{ env.RESKIN_REVISION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test bundled Clickt image
        run: |
          scripts/smoke-clickt-image.sh \
            "$SMOKE_IMAGE" \
            "https://github.com/$GITHUB_REPOSITORY" \
            "$GITHUB_SHA" \
            "$IMAGE_VERSION" \
            "$UPSTREAM_VERSION" \
            "$RESKIN_REVISION" \
            amd64
