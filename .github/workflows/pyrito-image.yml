name: Publish Pyrito Ops bundled image

on:
  workflow_dispatch:

concurrency:
  group: pyrito-image-${{ github.sha }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/performance-clickt/kaneo
  UPSTREAM_VERSION: "2.18.0"
  BRAND_VERSION: "1.2.0"
  BRAND_REVISION: 285d84816f2a8659148a4e9e692e14fdde6242a571ccd296b424f08ed89db866

jobs:
  publish:
    if: ${{ github.repository == 'performance-clickt/kaneo' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout reviewed source
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Derive immutable image version
        id: version
        env:
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          package_version="$(jq -r '.version' package.json)"
          test "$package_version" = "$UPSTREAM_VERSION"
          test "$(git rev-parse HEAD)" = "$SOURCE_REVISION"
          test "$(sha256sum brand/pyrito/pyrito-brand.json | cut -d' ' -f1)" = "$BRAND_REVISION"

          short_brand="${BRAND_REVISION:0:12}"
          short_source="${SOURCE_REVISION:0:12}"
          image_version="v${UPSTREAM_VERSION}-pyrito-ops.${BRAND_VERSION}.${short_brand}.${short_source}"
          image_ref="${IMAGE}:${image_version}"

          echo "image_version=$image_version" >> "$GITHUB_OUTPUT"
          echo "image_ref=$image_ref" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite an existing immutable tag
        env:
          IMAGE_REF: ${{ steps.version.outputs.image_ref }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$IMAGE_REF" >/dev/null 2>&1; then
            echo "::error::Immutable image tag already exists: $IMAGE_REF"
            exit 1
          fi

      - name: Build amd64 smoke image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.kaneo
          platforms: linux/amd64
          load: true
          push: false
          tags: pyrito-smoke:${{ github.sha }}
          build-args: |
            OCI_SOURCE=https://github.com/${{ github.repository }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.version.outputs.image_version }}
            KANEO_UPSTREAM_VERSION=${{ env.UPSTREAM_VERSION }}
            PYRITO_BRAND_VERSION=${{ env.BRAND_VERSION }}
            PYRITO_BRAND_REVISION=${{ env.BRAND_REVISION }}
          cache-from: type=gha

      - name: Smoke test clean bundled container
        env:
          SMOKE_IMAGE: pyrito-smoke:${{ github.sha }}
          IMAGE_VERSION: ${{ steps.version.outputs.image_version }}
        run: |
          scripts/smoke-pyrito-image.sh \
            "$SMOKE_IMAGE" \
            "https://github.com/$GITHUB_REPOSITORY" \
            "$GITHUB_SHA" \
            "$IMAGE_VERSION" \
            "$UPSTREAM_VERSION" \
            "$BRAND_VERSION" \
            "$BRAND_REVISION" \
            amd64

      - name: Build and publish multi-architecture image
        id: publish
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.kaneo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.image_ref }}
          labels: |
            org.opencontainers.image.title=Pyrito Ops
            org.opencontainers.image.description=Pyrito Ops self-hosted project management workspace
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.image_version }}
            org.opencontainers.image.licenses=MIT
            io.pyrito.kaneo.upstream-version=${{ env.UPSTREAM_VERSION }}
            io.pyrito.kaneo.brand-version=${{ env.BRAND_VERSION }}
            io.pyrito.kaneo.brand-revision=${{ env.BRAND_REVISION }}
          build-args: |
            OCI_SOURCE=https://github.com/${{ github.repository }}
            OCI_REVISION=${{ github.sha }}
            OCI_VERSION=${{ steps.version.outputs.image_version }}
            KANEO_UPSTREAM_VERSION=${{ env.UPSTREAM_VERSION }}
            PYRITO_BRAND_VERSION=${{ env.BRAND_VERSION }}
            PYRITO_BRAND_REVISION=${{ env.BRAND_REVISION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true

      - name: Record digest metadata
        env:
          DIGEST: ${{ steps.publish.outputs.digest }}
          IMAGE_REF: ${{ steps.version.outputs.image_ref }}
          IMAGE_VERSION: ${{ steps.version.outputs.image_version }}
          SOURCE_REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          jq -n \
            --arg image "$IMAGE" \
            --arg tag "$IMAGE_REF" \
            --arg digest "$DIGEST" \
            --arg version "$IMAGE_VERSION" \
            --arg upstreamVersion "$UPSTREAM_VERSION" \
            --arg brandVersion "$BRAND_VERSION" \
            --arg brandRevision "$BRAND_REVISION" \
            --arg sourceRevision "$SOURCE_REVISION" \
            '{image: $image, tag: $tag, digest: $digest, immutableRef: ($image + "@" + $digest), version: $version, upstreamVersion: $upstreamVersion, brandVersion: $brandVersion, brandRevision: $brandRevision, sourceRevision: $sourceRevision, platforms: ["linux/amd64", "linux/arm64"]}' \
            > pyrito-image-metadata.json

          {
            echo "### Pyrito Ops image published"
            echo
            echo "- Tag: \`$IMAGE_REF\`"
            echo "- Immutable reference: \`$IMAGE@$DIGEST\`"
            echo "- Source revision: \`$SOURCE_REVISION\`"
            echo "- Brand version: \`$BRAND_VERSION\`"
            echo "- Brand revision: \`$BRAND_REVISION\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload digest metadata
        uses: actions/upload-artifact@v6
        with:
          name: pyrito-image-${{ steps.version.outputs.image_version }}
          path: pyrito-image-metadata.json
          if-no-files-found: error
          retention-days: 90
